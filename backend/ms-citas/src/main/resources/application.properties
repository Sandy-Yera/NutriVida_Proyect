# ms-citas · Citas, disponibilidad, pagos simulados y estadísticas.
spring.application.name=ms-citas
server.port=8082

# Perfil por defecto: H2 en memoria, como en DoggySpa (se borra al detener la app).
# Para MySQL 8 (docker-compose.yml) se activa el perfil "mysql".
spring.datasource.url=jdbc:h2:mem:nutrivida_citas;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Fechas y horas como en EP2: AAAA-MM-DD y HH:mm, en la zona de la clínica.
spring.jackson.time-zone=America/Santiago

# JWT común a los 3 microservicios (HS256, 8 h). El secreto real va en la variable de
# entorno JWT_SECRET; este valor por defecto es solo para desarrollo local.
nutrivida.jwt.secreto=${JWT_SECRET:solo-desarrollo-cambiar-por-JWT_SECRET-32b}
nutrivida.jwt.horas=8

# ms-clinica (R6): horario de cada nutricionista y duración, precio y modalidad de cada servicio.
# Sin URL se usan las semillas de EP2. Modo auto = ms-clinica y, si no responde, las semillas;
# http = solo ms-clinica (503 si no responde); simulado = solo las semillas. Ver ClinicaConfig.
nutrivida.clinica.url=${NUTRIVIDA_CLINICA_URL:}
nutrivida.clinica.modo=${NUTRIVIDA_CLINICA_MODO:auto}
nutrivida.clinica.espera-ms=3000

# ms-usuarios (R8): un usuario desactivado pierde el acceso aunque su token siga vigente.
# Se consulta GET /api/usuarios/{id} y la respuesta se recuerda 30 s por usuario. Mismos
# modos que ms-clinica: auto (y, si no responde, las semillas de EP2), http o simulado.
nutrivida.usuarios.url=${NUTRIVIDA_USUARIOS_URL:}
nutrivida.usuarios.modo=${NUTRIVIDA_USUARIOS_MODO:auto}
nutrivida.usuarios.espera-ms=3000
nutrivida.usuarios.cache-segundos=30

# Origen del frontend (Vite) permitido por CORS.
nutrivida.cors.origenes=http://localhost:5173,http://127.0.0.1:5173

springdoc.swagger-ui.path=/swagger-ui.html
