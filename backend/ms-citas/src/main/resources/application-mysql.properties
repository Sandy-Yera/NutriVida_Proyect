# Perfil "mysql": MySQL 8 del docker-compose.yml (raíz del repositorio).
# En Docker lo activa SPRING_PROFILES_ACTIVE=mysql y DB_HOST=mysql (nombre del servicio).
# Desde el IDE: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql" (DB_HOST=localhost por defecto).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/nutrivida_citas?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:nutrivida}
spring.datasource.password=${DB_PASSWORD:nutrivida_dev}
# Las tablas las crea database/*.sql (modelo 3FN explícito); JPA solo comprueba que calcen.
spring.jpa.hibernate.ddl-auto=validate
