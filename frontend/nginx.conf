# Nginx del contenedor "frontend": sirve la SPA y hace de proxy hacia los microservicios.
# Las rutas son las mismas que el proxy de vite.config.js (desarrollo) y las del contrato EP3.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con variables en proxy_pass, Nginx vuelve a resolver el nombre
    # del servicio: si un microservicio se reinicia (y cambia de IP), el proxy lo sigue encontrando,
    # y Nginx arranca aunque un microservicio todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ms_usuarios http://ms-usuarios:8081;
    set $ms_citas    http://ms-citas:8082;
    set $ms_clinica  http://ms-clinica:8083;

    client_max_body_size 3m;   # foto de perfil: 2 MB más el resto del formulario

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;   # los errores JSON de los microservicios pasan tal cual

    location ^~ /api/auth         { proxy_pass $ms_usuarios; }
    location ^~ /api/usuarios     { proxy_pass $ms_usuarios; }
    location ^~ /api/articulos    { proxy_pass $ms_usuarios; }

    location ^~ /api/citas        { proxy_pass $ms_citas; }
    location ^~ /api/pagos        { proxy_pass $ms_citas; }
    location ^~ /api/disponibilidad { proxy_pass $ms_citas; }
    # Plan B (perfil dev de ms-citas): token de prueba mientras no hay login. Sin el perfil, 404.
    location ^~ /api/dev          { proxy_pass $ms_citas; }

    location ^~ /api/servicios    { proxy_pass $ms_clinica; }
    location ^~ /api/nutricionistas { proxy_pass $ms_clinica; }
    location ^~ /api/pacientes    { proxy_pass $ms_clinica; }
    location ^~ /api/contactos    { proxy_pass $ms_clinica; }

    # Un /api/... que no es de nadie: mismo JSON de error común que los microservicios.
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"timestamp":"$time_iso8601","status":404,"error":"Not Found","mensaje":"La ruta solicitada no existe.","ruta":"$uri"}';
    }

    # Microservicio apagado o reiniciando: en vez de la página HTML de Nginx, el JSON común.
    error_page 502 503 504 = @sin_servicio;
    location @sin_servicio {
        default_type application/json;
        return 503 '{"timestamp":"$time_iso8601","status":503,"error":"Service Unavailable","mensaje":"El servicio no está disponible en este momento. Intenta en unos segundos.","ruta":"$uri"}';
    }

    # SPA: React Router resuelve /mis-citas, /admin/..., etc. Cualquier ruta que no sea un archivo
    # devuelve index.html. Los archivos con hash de Vite se cachean; index.html nunca.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
